name: Release

# Push a tag like v1.0.0 to build AudioTemplates.exe and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" AudioTemplates.exe --title "Audio Templates ${{ github.ref_name }}" --generate-notes
